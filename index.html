<style>

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

  --verde:#3DBA74;--verde-osc:#8BD9AC;--on-verde:#0D1410;--oro:#E2C25B;--side:#0A2615;--side-ink:#BFD6C7;
  --ok:#8BD9AC;--ok-bg:#17331F;--amb:#E8C766;--amb-bg:#3A3117;--err:#FF8A80;--err-bg:#3A1E1B;--info-bg:#18293A;--info:#9CC7E6;
  --sel:#1D3326;--hover:#18231D;
  --c1:#8BD9AC;--c2:#7DB9D8;--c3:#3DBA74;--c4:#E2C25B;--c5:#E59A72;--c6:#B7A3E6;--c7:#9CAEA3;--c8:#D8C58E;}}
:root[data-theme="dark"]{
  --bg:#0D1410;--surface:#151E19;--surface-2:#1B2620;--ink:#E3EBE6;--muted:#9CAEA3;--line:#29362F;

  --ok:#8BD9AC;--ok-bg:#17331F;--amb:#E8C766;--amb-bg:#3A3117;--err:#FF8A80;--err-bg:#3A1E1B;--info-bg:#18293A;--info:#9CC7E6;
  --sel:#1D3326;--hover:#18231D;

*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;line-height:1.5}
.num,.t td.r{font-variant-numeric:tabular-nums}
button{font:inherit}

.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}

      .side-foot{display:none}
}
.bar{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;padding:18px 28px 14px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}

.rol{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.rol select{width:auto}
.content{padding:24px 28px 40px;max-width:1380px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;margin-bottom:20px}

.card-b{padding:16px 18px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}

.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.kpi .k{font-size:13px;color:var(--muted);margin:0}
.kpi .v{font-size:26px;font-weight:700;margin:4px 0 0;letter-spacing:-.02em;line-height:1.15}

.scroll{overflow-x:auto}
table.t{width:100%;border-collapse:collapse}
.t th{text-align:left;font-weight:600;font-size:12.5px;color:var(--muted);background:var(--surface-2);padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.t td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}

.chip.err{background:var(--err-bg);color:var(--err)}
.chip.info{background:var(--info-bg);color:var(--info)}
.capa{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--cc);color:var(--surface);font-size:11.5px;font-weight:700;margin-right:6px;vertical-align:-5px}
.btn{font-weight:600;font-size:13.5px;border-radius:6px;padding:8px 14px;cursor:pointer;border:1px solid transparent;background:transparent;color:var(--ink);white-space:nowrap}

.btn.link{padding:4px 6px;color:var(--verde-osc)}

.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500;margin-bottom:12px}
input,select,textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:0;width:100%}
textarea{min-height:70px;resize:vertical}
input[type=checkbox],input[type=radio]{width:auto}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:12.5px;color:var(--muted);margin:-6px 0 12px}
.nota{font-size:12.5px;color:var(--muted)}
.banner{padding:10px 14px;border-radius:6px;font-size:13.5px;margin:0 0 12px}
.banner.adv{background:var(--amb-bg)}
.banner.err{background:var(--err-bg);color:var(--err)}
.banner.info{background:var(--info-bg);color:var(--info)}
.banner.ok{background:var(--ok-bg);color:var(--ok)}
.sim{display:grid;grid-template-columns:minmax(300px,360px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:1000px){.sim{grid-template-columns:1fr}}

.lin-h,.lin{display:grid;grid-template-columns:minmax(0,1fr) 68px 76px 32px;gap:6px;align-items:center}
.lin-h{font-size:12px;color:var(--muted);margin-bottom:4px}
.lin{margin-bottom:6px}
.x{width:32px;height:34px;border:1px solid var(--line);background:transparent;border-radius:6px;color:var(--muted);cursor:pointer;font-size:17px;line-height:1}
.lres-h{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.lres-h h3{margin:0;font-size:15px}
.lres-h .fin{text-align:right}
.fin .u{font-size:18px;font-weight:700;margin:0}
.fin .s{font-size:12.5px;color:var(--muted);margin:0}
.bandas{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.banda{display:flex;flex-direction:column;padding:5px 10px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;line-height:1.3;min-width:80px}
.banda b{font-weight:600}
.banda span{color:var(--muted)}
.banda.on{border-color:var(--verde);background:var(--verde);color:var(--on-verde)}
.banda.on span{color:inherit}
.esc{margin:0 18px 14px;padding:10px 14px;background:var(--surface-2);border-radius:6px;font-size:13px;color:var(--muted)}
.esc strong{color:var(--ink)}
.steps{display:flex;gap:0;list-style:none;margin:0 0 20px;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow-x:auto}
.steps li{flex:1;display:flex;align-items:center;gap:10px;padding:12px 16px;font-size:13.5px;color:var(--muted);white-space:nowrap;border-right:1px solid var(--line)}
.steps li:last-child{border-right:0}
.steps .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--muted);flex:none}
.steps li.act{color:var(--ink);font-weight:600}
.steps li.act .n{background:var(--verde);color:var(--on-verde)}
.steps li.done .n{background:var(--ok-bg);color:var(--ok)}
.drop{border:2px dashed var(--line);border-radius:8px;padding:36px 20px;text-align:center;background:var(--surface-2)}
.drop.over{border-color:var(--verde);background:var(--ok-bg)}
.drop p{margin:6px 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;font-size:13px;cursor:pointer;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--sel);color:var(--ink);font-weight:600}
input.sw{appearance:none;-webkit-appearance:none;width:36px;min-width:36px;height:20px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;margin:0;border:0;padding:0;flex:none}
.sw::before{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--surface);transition:transform .15s}
.sw:checked{background:var(--verde)}
.sw:checked::before{transform:translateX(16px)}
.sw:disabled{opacity:.5;cursor:not-allowed}
@media (prefers-reduced-motion:reduce){.sw::before{transition:none}}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
@media (max-width:1000px){.grid2{grid-template-columns:1fr}}
pre{background:var(--surface-2);border-radius:6px;padding:14px;overflow-x:auto;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.55;margin:0}
dialog{border:0;border-radius:10px;padding:0;width:min(680px,calc(100vw - 24px));max-height:calc(100vh - 40px);background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(8,18,12,.5)}
.dlg{display:flex;flex-direction:column;max-height:calc(100vh - 40px)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line)}
.dlg-h h2{margin:0;font-size:16px}
.dlg-b{padding:16px 20px;overflow:auto}
.dlg-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 20px;border-top:1px solid var(--line)}
fieldset{border:1px solid var(--line);border-radius:6px;padding:10px 12px 12px;margin:0 0 12px;min-width:0}
legend{font-size:13px;color:var(--muted);font-weight:500;padding:0 4px}
.chks{display:flex;flex-wrap:wrap;gap:6px 16px}
.chk{display:flex;gap:6px;align-items:center;font-size:13.5px;color:var(--ink);font-weight:400}
.sep{font-size:13.5px;font-weight:600;margin:16px 0 8px}
.rows .r{display:grid;grid-template-columns:1fr 1fr 32px;gap:6px;margin-bottom:6px}
.rows input.bad{border-color:var(--err);box-shadow:0 0 0 2px var(--err-bg)}
.hasta{display:flex;align-items:center;padding:0 10px;border:1px dashed var(--line);border-radius:6px;font-size:14px;color:var(--muted);min-height:34px;font-variant-numeric:tabular-nums}
.hasta.err{color:var(--err);border-color:var(--err)}
.ep{border-top:1px solid var(--line);padding:10px 0}
.ep:first-of-type{border-top:0}
.ep-b{margin:8px 0 0 24px}
.rows .r.b4,.ep-h{grid-template-columns:1fr 1fr 1fr 32px}
.rows .r.b5,.ep-h.w5{grid-template-columns:1fr 1fr 1fr 1fr 32px}
.ep-h{display:grid;gap:6px;font-size:12px;color:var(--muted);margin-bottom:4px}
.md-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.md{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:1100px){.md{grid-template-columns:1fr}}
.md-left{margin:0;position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto;padding-bottom:8px}
@media (max-width:1100px){.md-left{position:static;max-height:none}}
.md-left-h{display:flex;justify-content:space-between;padding:10px 16px;font-size:12px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line);background:var(--surface-2);position:sticky;top:0;z-index:1}
.li-grp{margin:0;padding:12px 16px 4px;font-size:12px;font-weight:600;color:var(--muted)}
.li-item{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;padding:10px 13px;cursor:pointer;color:var(--ink)}
.li-item:hover{background:var(--hover)}
.li-item.on{background:var(--sel);border-left-color:var(--verde)}
.li-item.off .li-main{opacity:.55}
.li-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.li-cod{font-weight:700;font-size:13.5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.li-nom{font-size:13px}
.li-alc{font-size:12px;color:var(--muted)}
.li-idx{display:flex;flex-direction:column;align-items:flex-end;gap:2px;white-space:nowrap;font-size:13px}
.li-warn{font-size:11px;font-weight:600;color:var(--amb);background:var(--amb-bg);padding:1px 7px;border-radius:999px}
.md-right{margin:0}
.minis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:14px}
@media (max-width:700px){.minis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.mini{background:var(--surface);padding:10px 16px}
.mini .k{margin:0;font-size:12px;color:var(--muted)}
.mini .v{margin:2px 0 0;font-size:20px;font-weight:700}
.mini .s{margin:2px 0 0;font-size:12px;color:var(--muted)}
.tabs-in{display:flex;gap:4px;padding:0 12px;border-bottom:1px solid var(--line)}
.tabs-in button{border:0;background:none;padding:11px 12px;font-weight:600;font-size:13.5px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs-in button[aria-selected="true"]{color:var(--verde-osc);border-bottom-color:var(--verde)}
.nav-g{margin:14px 12px 4px;font-size:11.5px;font-weight:600;color:var(--side-ink);opacity:.6;letter-spacing:.02em}

.content{padding:28px 32px 48px}
.card{border-color:var(--line);border-radius:10px;margin-bottom:24px;box-shadow:0 1px 2px rgba(20,35,25,.04)}
.card-h{padding:16px 20px}
.card-b{padding:18px 20px}
.kpis{gap:16px;margin-bottom:24px}
.kpi{border-radius:10px;padding:16px 18px;box-shadow:0 1px 2px rgba(20,35,25,.04)}
.t th{background:var(--surface-2);font-weight:600;padding:10px 14px}
.t td{padding:11px 14px}
.bar{padding:20px 32px 16px}
.ms{position:relative;margin-bottom:12px}
.ms[hidden]{display:none!important}
.fld[hidden],.row2[hidden],.chk[hidden]{display:none!important}
.grid-ms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px;align-items:start}

.ms-btn::after{content:"";position:absolute;right:12px;top:50%;width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:translateY(-70%) rotate(45deg)}

.ms-ph{color:var(--muted);font-size:14px;padding-left:2px}

.ms-op[hidden]{display:none}

.nav-sec{margin-bottom:4px}
.nav-gbtn{display:flex;justify-content:space-between;align-items:center;width:100%;padding:8px 12px 6px;background:none;border:0;color:var(--side-ink);opacity:.75;font-size:12px;font-weight:600;cursor:pointer;letter-spacing:.02em}

/* ================= Versiones de listas ================= */

  const cliente=CLIENTES.find(c=>c.id===inp.clienteId)||CLIENTES[0];
  const momento=inp.momento||ahoraLocal();const ctx={cliente,canalPedido:inp.canalPedido,momento,fecha:momento.slice(0,10),
    lineas:inp.lineas.filter(l=>l.sku&&l.cant>0).map(l=>({sku:l.sku,cant:l.cant,rebaja:l.rebaja||0,producto:prod(l.sku),precioUnit:null,precioLista:null,precioRef:null,descCarrito:0,pasos:[],resuelto:{},pactado:false,alertas:[]})),
    cargos:[],regalos:[],beneficios:[],alertas:[],aplicadas:[],requiereAprobacion:false,bloqueadas:[]};
  ctx.lineas=ctx.lineas.filter(l=>{const p=l.producto;
    const m=!p?'no existe en el maestro de productos':!p.activo?'está inactivo en el maestro de productos':!(p.canales||[]).includes(ctx.canalPedido)?`no se vende por el canal ${ctx.canalPedido}`:null;
    if(m){ctx.bloqueadas.push({sku:l.sku,nombre:p?.nombre||l.sku,motivo:m});return false}return true});
  for(const capa of CAPAS){
    const reglas=state.reglas.filter(r=>r.activa&&TIPOS[r.tipo]&&TIPOS[r.tipo].capa===capa.id&&elegible(r,ctx)).sort((a,b)=>(a.prioridad||0)-(b.prioridad||0));
    for(const r of reglas){let ok=false;try{ok=!!TIPOS[r.tipo].aplicar(ctx,r)}catch(e){ctx.alertas.push({nivel:'err',texto:`La regla ${r.codigo||r.nombre} falló y se omitió.`})}
      if(ok){ctx.aplicadas.push(r.id);if(r.exclusiva&&capa.modo==='acumula')break}}
    if(capa.id===1)for(const l of ctx.lineas){if(l.precioUnit==null)l.alertas.push({nivel:'err',texto:'No hay precio base vigente para este cliente y producto. La línea no se cotiza.'})}
    if(capa.id===2)for(const l of ctx.lineas)l.precioLista=l.precioUnit;
    if(capa.id===3)for(const l of ctx.lineas)l.precioRef=l.precioUnit;
    if(capa.id===4)for(const l of ctx.lineas)if(l.cerrado&&l.rebaja)l.alertas.push({nivel:'adv',texto:'Precio fijo de SAP: el ajuste negociado no se aplica.'});
    if(capa.id===4)for(const l of ctx.lineas){if(l.precioUnit==null||!l.rebaja||l.cerrado)continue;
      let p=l.rebaja;const b=bandaLista(l.lista,l.sku);
      if(b&&p>0&&b.abajo!=null&&p>b.abajo){l.alertas.push({nivel:'adv',texto:`La rebaja de ${p} pts supera la banda de ${l.lista.codigo} (${b.abajo} pts). Se aplicó el máximo permitido.`});p=b.abajo}
      if(b&&p<0&&b.arriba!=null&&-p>b.arriba){l.alertas.push({nivel:'adv',texto:`El sobreprecio de ${-p} pts supera la banda de ${l.lista.codigo} (${b.arriba} pts). Se aplicó el máximo permitido.`});p=-b.arriba}
      l.rebajaAplicada=p;motor.cambiar(l,{_capa:4,nombre:p>0?'Rebaja negociada por el vendedor':'Sobreprecio negociado por el vendedor',codigo:b?`Banda ${l.lista.codigo}: −${b.abajo??'∞'} / +${b.arriba??'∞'} pts`:''},`${p>0?'−':'+'}${Math.abs(p)} pts por ${uV(l.producto)}`,()=>{l.precioUnit-=p/100})}
  }
  const huerf=state.reglas.filter(r=>r.activa&&!TIPOS[r.tipo]).length;
  if(huerf)ctx.alertas.push({nivel:'adv',texto:`${huerf} regla(s) usan un tipo no registrado y se omitieron.`});
  let total=0,lista=0;
  for(const l of ctx.lineas){if(l.precioUnit==null){l.subtotal=0;l.efectivo=0;continue}l.subtotal=r2(motor.sub(l));l.efectivo=r2(l.subtotal/(qF(l)||1));total+=l.subtotal;lista+=l.precioLista*qF(l);if(porPeso(l.producto))l.alertas.push({nivel:'info',texto:`Monto referencial: ${fq(l.cant)} ${l.producto.unidad}${l.cant===1?'':'es'} × ${fq(l.producto.pesoKg||0)} kg de peso referencial = ${fq(qF(l))} kg. Se factura con el peso real pesado en el despacho.`})}
  const cargos=ctx.cargos.reduce((s,c)=>s+c.monto,0);
  ctx.subtotal=r2(total);ctx.total=r2(total+cargos);ctx.valorLista=r2(lista);ctx.ahorro=r2(lista-total);
  return ctx;
}

function buscarTodo(q){q=normH(q);if(!q)return [];const res=[],add=(tipo,t,sub,fn)=>{if(res.length<12)res.push({tipo,t,sub,fn})};
  Object.entries(VISTAS).filter(([k])=>k!=='estructura'&&normH(VISTAS[k][0]).includes(q)).forEach(([k,[t]])=>add('Página',t,GRUPO_DE[k]||'',()=>ir(k)));

  listas().filter(r=>normH(r.nombre+' '+r.codigo).includes(q)).forEach(r=>add('Lista',r.nombre,r.codigo,()=>{state.listaSel=r.id;ir('listas')}));
  state.reglas.filter(r=>r.tipo!=='lista'&&normH(r.nombre+' '+(r.codigo||'')).includes(q)).forEach(r=>add('Promoción',r.nombre,r.codigo||'',()=>{ir('reglas');if(permisoRegla(r).ok&&TIPOS[r.tipo])abrirRegla(r.id)}));
  CLIENTES.filter(c=>normH(c.nombre+' '+(c.ruc||'')).includes(q)).forEach(c=>add('Cliente',c.nombre,`${c.org}, ${c.canal}`,()=>{state.cliF={q:c.nombre,org:'',sede:'',canal:''};ir('clientes')}));
  return res}

async function procesar(file){

  if(!['xlsx','xls','csv'].includes(ext)){state.carga={paso:2,errorArchivo:'Formato no admitido. Sube un archivo .xlsx, .xls o .csv.'};return render()}
  if(!window.XLSX){state.carga={paso:2,errorArchivo:'No se pudo cargar el lector de Excel. Recarga la página.'};return render()}
  try{const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});state.carga={paso:3,...validar(wb,file.name)};state.filtro='todos';
    audit('Validó un archivo',`${file.name}: ${state.carga.filas.length} filas, ${state.carga.filas.filter(f=>f.nivel==='error').length} con error.`)}
  catch(e){state.carga={paso:2,errorArchivo:'No se pudo leer el archivo. Verifica que no esté dañado ni protegido con contraseña.'}}
  render();
}

function publicar(){
  const c=state.carga,err=$('#pub-err'),fail=m=>{err.textContent=m;err.hidden=false};
  if(!puede())return;const desde=$('#pub-desde').value,com=$('#pub-com').value.trim();

  if($('#pub-ok')&&!$('#pub-ok').checked)return fail('Confirma que revisaste las advertencias.');
  const ok=c.filas.filter(f=>f.nivel!=='error');let nP=0,nL=0,nB=0,nE=0,nPr=0;const vers=[];
  ok.filter(f=>f.hoja==='Productos'&&f.cambio).forEach(f=>{const ex=prod(f.sku);if(ex)Object.assign(ex,f.data);else PRODUCTOS.push({...f.data,igv:'Por confirmar',canales:[...CANALES_PEDIDO],alta:hoy()});nPr++});
  const porLista={};ok.filter(f=>f.hoja==='Precios'&&f.cambio).forEach(f=>(porLista[f.lista]=porLista[f.lista]||[]).push(f));
  for(const [id,fs] of Object.entries(porLista)){const r=state.reglas.find(x=>x.id===id);
    const base=versionVigente(r,desde)||[...(r.versiones||[])].sort((a,b)=>b.v-a.v)[0];const precios={...(base?.precios||{})};
    fs.forEach(f=>{precios[f.sku]=f.nuevo;nP++});const nv=crearVersion(r,precios,desde,`Carga masiva (${c.archivo})`,com);nL++;vers.push(`${r.codigo} v${nv}`)}
  const porEsc={};ok.filter(f=>f.hoja==='Escalas'&&!f.elimina&&f.lista).forEach(f=>{((porEsc[f.lista]=porEsc[f.lista]||{})[f.sku]=porEsc[f.lista][f.sku]||[]).push(f.band||{desde:f.desde,valor:f.nuevo})});
  for(const [id,skus] of Object.entries(porEsc)){const r=state.reglas.find(x=>x.id===id);const cambia=ok.some(f=>f.lista===id&&f.hoja==='Escalas'&&f.cambio);if(!cambia)continue;
    r.params.tabla=r.params.tabla||{};for(const [s,bs] of Object.entries(skus)){r.params.tabla[s]=bs.sort((a,b)=>a.desde-b.desde);nB+=bs.length}nE++}
  const fut=desde>hoy();
  const msg=`${nPr?nPr+' producto(s) creados o actualizados; ':''}${nP} precio(s) en ${nL} lista(s)${nE?` y ${nB} banda(s) en ${nE} escala(s)`:''}. ${vers.length?`Versiones creadas: ${vers.join(', ')}, ${fut?'programadas desde':'vigentes desde'} ${fFecha(desde)}.`:''}`;
  audit('Publicó carga masiva',`${c.archivo}: ${msg} ${com}`);state.carga={paso:5,mensaje:msg};render();toast('Carga publicada');
}

  'mae-del':a=>{const k=a.dataset.k,n=a.dataset.n,u=usoMae(k,n);if(u.cli||u.reg||u.hijos)return toast(`No se puede eliminar ${n}: lo usan ${u.cli} cliente(s), ${u.reg} lista(s) o regla(s) y ${u.hijos} nivel(es) inferiores. Desactívalo en su lugar.`);
    if(confirm(`¿Eliminar ${n}?`)){EST[k]=EST[k].filter(x=>x.nombre!==n);syncDims();audit(`Eliminó ${MAE[k].t.toLowerCase()}`,n+'.');render();toast('Eliminado')}},
  'cli-nuevo':()=>abrirCli(null),'cli-ed':a=>abrirCli(a.dataset.id),
  'cli-del':a=>{const c=CLIENTES.find(x=>x.id===a.dataset.id),n=state.reglas.filter(r=>(r.alcance?.clientes||[]).includes(c.id)).length;if(n)return toast(`No se puede eliminar: ${n} regla(s) mencionan a este cliente.`);
    if(confirm(`¿Eliminar ${c.nombre}?`)){CLIENTES.splice(CLIENTES.indexOf(c),1);if(state.sim.clienteId===c.id)state.sim.clienteId=CLIENTES[0]?.id;audit('Eliminó un cliente',c.nombre+'.');render();toast('Cliente eliminado')}},
  'lp-tab':a=>{state.listasPag=a.dataset.t;render()},'lt-tab':a=>{state.listaTab=a.dataset.t;render()},'ver-todo':a=>{state.verTodo=state.verTodo||{};state.verTodo[a.dataset.id]=!state.verTodo[a.dataset.id];render()},
  'fac-nuevo':()=>abrirFactor(null),'fac-ed':a=>abrirFactor(a.dataset.id),
  'fac-del':a=>{const f=FACTORES.find(x=>x.id===a.dataset.id);if(confirm('¿Eliminar este factor? Los SKU vuelven a usar el factor del maestro.')){FACTORES.splice(FACTORES.indexOf(f),1);audit('Eliminó un factor por agrupador',descGrupo(f.grupo)+'.');render();toast('Factor eliminado')}},
  'prod-nuevo':()=>abrirProducto(null),'pg':a=>{state.pag[a.dataset.k].n=+a.dataset.n;PAG_R[a.dataset.k]()},'exp':a=>{const [n,c,r]=EXPORT[a.dataset.x]();exportarExcel(n,c,r)},'pf-toggle':()=>{state.pfAbierto=!state.pfAbierto;renderProductos()},'pf-limpiar':()=>{['tipo','cat','attr','est'].forEach(k=>state.pf[k]='');renderProductos()},
  'lista-general':a=>{listas().forEach(r=>delete r.general);const r=state.reglas.find(x=>x.id===a.dataset.id);r.general=true;audit('Cambió la lista general',`${r.codigo} es ahora la lista general.`);render();toast(`${r.codigo} es la lista general`)},
  'attr-nuevo':()=>abrirAtributo(null),'attr-ed':a=>abrirAtributo(a.dataset.id),
  'attr-del':a=>{const at=ATRIBUTOS.find(x=>x.id===a.dataset.id),u=usoAtributo(at.id);
    if(u.ps.length||u.rs.length)return toast(`No se puede eliminar ${at.nombre}: lo usan ${u.ps.length} producto(s) y ${u.rs.length} regla(s).`);
    if(confirm(`¿Eliminar el atributo ${at.nombre}?`)){ATRIBUTOS.splice(ATRIBUTOS.indexOf(at),1);audit('Eliminó un atributo',at.nombre+'.');render();toast('Atributo eliminado')}},
  'cat-add':a=>{const t=a.dataset.t,inp=C.querySelector(`[data-catin="${t}"]`),v=(inp.value||'').trim();if(!v)return toast('Escribe el nombre de la categoría.');
    if((CAT[t]||[]).some(c=>normH(c)===normH(v)))return toast('Esa categoría ya existe.');(CAT[t]=CAT[t]||[]).push(v);audit('Creó una categoría',`${t}: ${v}.`);render();toast('Categoría agregada')},
  'cat-del':a=>{const t=a.dataset.t,c=a.dataset.c,n=PRODUCTOS.filter(p=>p.tipo===t&&p.categoria===c).length,rr=state.reglas.filter(r=>(r.alcance?.grupo?.categorias||[]).includes(t+'/'+c)).length;
    if(n||rr)return toast(`No se puede quitar ${c}: la usan ${n} producto(s) y ${rr} regla(s).`);
    CAT[t]=CAT[t].filter(x=>x!==c);audit('Eliminó una categoría',`${t}: ${c}.`);render();toast('Categoría eliminada')},
  'prod-ed':a=>abrirProducto(a.dataset.sku),
  'prod-sel':a=>abrirProducto(a.dataset.sku),
  'prod-del':a=>{const p=prod(a.dataset.sku),u=usoProducto(p.sku);
    if(u.total)return toast(`No se puede eliminar ${p.sku}: está en ${u.listas.length} lista(s) y ${u.reglas.length} regla(s). Desactívalo en su lugar.`);
    if(confirm(`¿Eliminar ${p.sku}? Esta acción queda registrada en auditoría.`)){setProductos(PRODUCTOS.filter(x=>x!==p));if(state.prodSel===p.sku)state.prodSel=null;audit('Eliminó un producto',`${p.sku}: ${p.nombre}.`);render();toast('Producto eliminado')}},
  'regla-nueva':a=>abrirRegla(null,a.dataset.tipo),
  'regla-ed':a=>abrirRegla(a.dataset.id),'regla-dup':a=>abrirRegla(null,null,a.dataset.id),
  'regla-del':a=>{const r=state.reglas.find(x=>x.id===a.dataset.id);if(confirm(`¿Eliminar ${r.codigo||r.nombre}? Esta acción queda registrada en auditoría.`)){state.reglas=state.reglas.filter(x=>x!==r);audit('Eliminó una regla',`${r.codigo}: ${r.nombre}.`);render();toast('Regla eliminada')}},
  'ver-ocultas':()=>{state.rf.est='todas';renderReglas()},
  'ejemplos':()=>{const ex=seed().filter(r=>r.tipo!=='lista'&&!state.reglas.some(x=>x.id===r.id));if(!ex.length)return toast('Los ejemplos ya están cargados.');state.reglas.push(...ex);audit('Cargó promociones de ejemplo',`${ex.length} reglas de demostración.`);render();toast(`${ex.length} promociones de ejemplo cargadas`)},
  'quitar-ejemplos':()=>{const ids=new Set(seed().filter(r=>r.tipo!=='lista').map(r=>r.id));const n=state.reglas.filter(r=>ids.has(r.id)).length;if(!n)return;if(!confirm(`¿Quitar las ${n} promociones de ejemplo? Las que creaste tú se mantienen.`))return;state.reglas=state.reglas.filter(r=>!ids.has(r.id));audit('Quitó promociones de ejemplo',`${n} reglas.`);render();toast('Ejemplos quitados')},
  'reset':()=>{if(confirm('¿Borrar todo y volver al estado inicial? Se eliminan listas, precios, promociones, productos y clientes. Esta acción no se puede deshacer.')){state.reglas=seedLimpio();state.auditoria=[];setProductos([]);setCatalogo(seedCatalogo());setFactores([]);setEstructura(seedEstructura());setClientes([]);CONFIG.huevosPorJaba=180;CONFIG.kgJaba=11;state.carga=null;guardar();render();toast('Datos borrados: el motor quedó vacío')}},
  'tipo-demo':()=>{motor.registrarTipo(TIPO_DEMO);try{localStorage.setItem(K_DEMO,'1')}catch(e){}audit('Registró un tipo de regla','Descuento por pago al contado (capa 4).');render();toast('Tipo registrado. Ya puedes crear reglas con él.')},
  'plantilla':()=>descargarPlantilla(),
  'carga-paso':a=>{state.carga={...(state.carga||{}),paso:+a.dataset.p,errorArchivo:undefined};render()},
  'carga-nueva':()=>{state.carga=null;render()},
  'pick-file':()=>$('#file').click(),
  'filtro':a=>{state.filtro=a.dataset.f;render()},
  'publicar':()=>publicar()
};
C.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(a&&!a.disabled)ACC[a.dataset.act]?.(a,e)});
$('#nav').addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(a)ACC[a.dataset.act](a,e)});
C.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.sim){const k=t.dataset.sim;state.sim[k]=t.value;renderSimRes()}
  else if(t.dataset.aq!==undefined){state.audQ=t.value;if(state.pag.auditoria)state.pag.auditoria.n=1;renderAudTabla()}
  else if(t.dataset.rf){state.rf[t.dataset.rf]=t.value;renderReglasCards()}
  else if(t.dataset.mf){state.maeF[t.dataset.k][t.dataset.mf]=t.value;if(state.pag['mae-'+t.dataset.k])state.pag['mae-'+t.dataset.k].n=1;renderMaeTabla(t.dataset.k)}
  else if(t.dataset.cf){state.cliF[t.dataset.cf]=t.value;if(state.pag.clientes)state.pag.clientes.n=1;if(t.dataset.cf==='org'){state.cliF.canal='';renderClientesPag()}else renderCliTabla()}
  else if(t.dataset.pf){state.pf[t.dataset.pf]=t.value;state.pag.productos&&(state.pag.productos.n=1);if(t.dataset.pf==='q')renderProductosTabla();else renderProductos()}
  else if(t.dataset.li!=null){const l=state.sim.lineas[+t.dataset.li];l[t.dataset.f]=t.dataset.f==='sku'?t.value:(num(t.value)||0);renderSimRes()}});
C.addEventListener('change',e=>{const t=e.target;
  if(t.matches('[data-ref]')){listas().forEach(r=>delete r.general);const r=state.reglas.find(x=>x.id===t.value);r.general=true;guardar();renderProductosTabla();toast(`La tabla muestra ahora los precios de ${r.nombre}`);return}
  if(t.dataset.cmp){state.verCmp=state.verCmp||{};const c=state.verCmp[t.dataset.id]=state.verCmp[t.dataset.id]||{a:'',b:hoy()};c[t.dataset.cmp]=t.value||hoy();const o=C.querySelector('details.cmp');render();return}
  if(t.dataset.vmes!==undefined){state.verMes=state.verMes||{};state.verMes[t.dataset.vmes]=t.value;render();return}
  if(t.dataset.pgTam){const k=t.dataset.pgTam;state.pag[k]={n:1,tam:+t.value};PAG_R[k]();return}
  if(t.dataset.on==='prod-tog'){const p=prod(t.dataset.sku);
    if(p.activo&&!t.checked&&usoProducto(p.sku).total&&!confirm(`${p.sku} tiene precios o reglas asociadas. Si lo desactivas, dejará de poder venderse. ¿Continuar?`)){t.checked=true;return}
    if(!p.activo&&t.checked&&!(p.canales||[]).length)p.canales=[...CANALES_PEDIDO];
    p.activo=t.checked;audit(p.activo?'Activó un producto':'Desactivó un producto',`${p.sku}: ${p.nombre}.`);renderProductos();toast(p.activo?'Producto activado':'Producto desactivado');return}
  if(t.dataset.on==='regla-tog'){const r=state.reglas.find(x=>x.id===t.dataset.id);if(!permisoRegla(r).ok){t.checked=!t.checked;return toast(permisoRegla(r).motivo)}r.activa=t.checked;audit(r.activa?'Activó una regla':'Desactivó una regla',`${r.codigo}: ${r.nombre}.`);render();toast(r.activa?'Regla activada':'Regla desactivada')}});
$('#file').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(f)procesar(f)});

cargar();state.usuario=state.usuario||'U1';state.rol=puede()?'analista':'jefe';pintarUsuarios();pintarNav();ir('panel');
</script>
